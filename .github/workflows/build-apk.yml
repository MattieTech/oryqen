name: Build Android APK

on:
  push:
    branches:
      - main
    paths:
      - 'frontend/**'
      - 'android/**'
      - 'capacitor.config.json'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Compile ORYQEN Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Install Node Dependencies
        run: npm install

      - name: Sync Capacitor Android Project
        run: npx cap sync android

      - name: Grant Execute Permission for Gradle Wrapper
        run: chmod +x android/gradlew

      - name: Generate Release Signing Keystore
        run: |
          keytool -genkey -v -keystore android/app/release.keystore -alias oryqen -keyalg RSA -keysize 2048 -validity 10000 -storepass oryqen2026 -keypass oryqen2026 -dname "CN=ORYQEN, OU=Mobile, O=SyntaxNexus, L=Lagos, ST=Lagos, C=NG"

      - name: Build Android Release APK with Gradle
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon --stacktrace
          cd ..

      - name: Prepare APK Artifact
        run: |
          mkdir -p build-output
          cp android/app/build/outputs/apk/release/app-release.apk build-output/oryqen-v1.0.0.apk

      - name: Upload APK to Job Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: oryqen-v1.0.0-apk
          path: build-output/oryqen-v1.0.0.apk
          if-no-files-found: error

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.0-apk
          name: ORYQEN Android Offline Edition (v1.0.0)
          body: |
            ## 🚀 ORYQEN Android On-Device AI Edition (v1.0.0)

            Download and install the official ORYQEN Android APK on any smartphone.
            
            ### ✨ Features
            - **100% On-Device Offline Intelligence**: Run neural models directly on mobile hardware in Airplane mode with zero internet.
            - **Online Cloud Super-Reasoning**: Seamless switch to ORYQEN Swift for web search and deep research.
            - **AI Tutor & Exam Prep**: Step-by-step Socratic teaching, LaTeX math rendering, interactive quizzes, and flashcards.
            - **Direct Sideloading**: Installs cleanly on Android 8.0+ devices.

            ### 📲 Installation
            1. Download `oryqen-v1.0.0.apk` below to your Android phone.
            2. Tap the downloaded file to install (allow "Install from Unknown Sources" if prompted).
            3. Open ORYQEN and experience on-device intelligence!
          files: build-output/oryqen-v1.0.0.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
